<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-15px) scale(1.05); }
      }
      @keyframes waveBar {
        0%, 100% { height: 18px; y: 191px; opacity: 0.35; }
        50% { height: 75px; y: 162px; opacity: 0.95; }
      }
      @keyframes pulseRing {
        0% { r: 35px; opacity: 0.8; }
        50% { r: 55px; opacity: 0.2; }
        100% { r: 35px; opacity: 0.8; }
      }
      .orb-1 { animation: floatSlow 8s ease-in-out infinite; }
      .orb-2 { animation: floatSlow 10s ease-in-out infinite 3s; }
      .pulse-circle { animation: pulseRing 4s ease-in-out infinite; }
      .bar-1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; }
      .bar-2 { animation: waveBar 1.4s ease-in-out infinite 0.3s; }
      .bar-3 { animation: waveBar 1.1s ease-in-out infinite 0.5s; }
      .bar-4 { animation: waveBar 1.5s ease-in-out infinite 0.2s; }
      .bar-5 { animation: waveBar 1.3s ease-in-out infinite 0.6s; }
      .bar-6 { animation: waveBar 1.6s ease-in-out infinite 0.4s; }
      .bar-7 { animation: waveBar 1.2s ease-in-out infinite 0.7s; }
      .bar-8 { animation: waveBar 1.4s ease-in-out infinite 0.25s; }
      .bar-9 { animation: waveBar 1.7s ease-in-out infinite 0.55s; }
      .bar-10 { animation: waveBar 1.3s ease-in-out infinite 0.15s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Background Glowing Orbs -->
  <g opacity="0.35">
    <circle class="orb-1" cx="200" cy="120" r="140" fill="#38bdf8" filter="url(#orbGlow)" />
    <circle class="orb-2" cx="1020" cy="280" r="160" fill="#a855f7" filter="url(#orbGlow)" />
    <circle cx="600" cy="360" r="120" fill="#06b6d4" filter="url(#orbGlow)" opacity="0.25" />
  </g>

  <!-- Technical Grid Pattern Background -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Animated Audio Visualizer Spectrum Wave in Background -->
  <g fill="url(#accentGrad)" filter="url(#glow)">
    <rect class="bar-1" x="90" y="191" width="6" height="18" rx="3" />
    <rect class="bar-2" x="105" y="191" width="6" height="18" rx="3" />
    <rect class="bar-3" x="120" y="191" width="6" height="18" rx="3" />
    <rect class="bar-4" x="135" y="191" width="6" height="18" rx="3" />
    <rect class="bar-5" x="150" y="191" width="6" height="18" rx="3" />
    <rect class="bar-6" x="165" y="191" width="6" height="18" rx="3" />
    <rect class="bar-7" x="180" y="191" width="6" height="18" rx="3" />

    <rect class="bar-8" x="1010" y="191" width="6" height="18" rx="3" />
    <rect class="bar-9" x="1025" y="191" width="6" height="18" rx="3" />
    <rect class="bar-10" x="1040" y="191" width="6" height="18" rx="3" />
    <rect class="bar-3" x="1055" y="191" width="6" height="18" rx="3" />
    <rect class="bar-5" x="1070" y="191" width="6" height="18" rx="3" />
    <rect class="bar-2" x="1085" y="191" width="6" height="18" rx="3" />
    <rect class="bar-7" x="1100" y="191" width="6" height="18" rx="3" />
  </g>

  <!-- Foreground Title and Content (Remains high contrast & unobstructed) -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Tag / Badge Pill -->
    <rect x="445" y="45" width="310" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="600" y="67" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.5">🎙️ AWESOME CURATED DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome AI Audio Enhancement
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="500" letter-spacing="0.2">
      Noise Suppression • Speech Restoration • Real-Time DSP • Studio AI
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="400">
      Production-Ready SaaS Platforms &amp; Self-Hosted Open-Source Deep Learning Models
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(185, 290)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="90" y="26" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="600">⚡ Real-Time Causal DSP</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(210, 0)">
        <rect width="195" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="97" y="26" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="600">🎧 Deep Speech Denoising</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(435, 0)">
        <rect width="185" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
        <text x="92" y="26" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="600">🚀 Cross-Platform GPU</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(650, 0)">
        <rect width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
        <text x="90" y="26" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="600">🛡️ Self-Hosted &amp; Open</text>
      </g>
    </g>
  </g>
</svg>
